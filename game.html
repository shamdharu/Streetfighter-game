<script>

function reset(){cam=0;coins=0;dmul=1;spm=1;ups=[0,0,0];bul=[];score=0;rage=0;wave=0;en=[];pt=[];tx=[];wd=[];pick=[];shake=0;over=false;paused=false;spawnT=50;combo=0;comboT=0;stop=0;flash=0;frame=0;

banner=bn;
/* audio */
let AC;function snd(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();
const P={punch:["square",220,70,.08,.2],kick:["sawtooth",160,35,.16,.3],hit:["triangle",110,35,.12,.3],ko:["sine",500,50,.5,.4],block:["square",300,100,.08,.2],sup:["sawtooth",80,900,.5,.35],pick:["sine",500,1000,.15,.25],dash:["sine",400,150,.1,.15]}[t];
const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=P[0];o.connect(g);g.connect(AC.destination);
o.frequency.setValueAtTime(P[1],n);o.frequency.exponentialRampToValueAtTime(P[2],n+P[3]);g.gain.setValueAtTime(P[4],n);g.gain.exponentialRampToValueAtTime(.01,n+P[3]);o.start();o.stop(n+P[3])}catch(e){}}
/* input */
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(K[k]&&["j","k","u","p","e"].includes(k))return;K[k]=1;

if("1234".includes(k)&&k)ns(+k);if("789".includes(k)&&k)buy(+k);if(k=="j")atk("p");if(k=="k")atk("k");if(k=="u")rageAtk();if(k=="e")grab();if(k=="r")reset();if(k=="p")paused=!paused;if(k=="shift")dash()});

document.querySelectorAll("#pad b").forEach(b=>{const k=b.dataset.k;b.addEventListener("pointerdown",e=>{e.preventDefault();K[k]=1;if(k=="j")atk("p");if(k=="k")atk("k");if(k=="u")rageAtk();if(k=="e")grab();if(k=="shift")dash()});
["pointerup","pointerleave","pointercancel"].forEach(v=>b.addEventListener(v,()=>K[k]=0))});
c.addEventListener("pointerdown",()=>{if(over)reset()});
/* fx */
function burst(px,py,col,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*7;pt.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:25+Math.random()*25,z:2+Math.random()*5,c:col})}}
function ft(px,py,t,col){tx.push({x:px,y:py,t,c:col,l:45})}
/* spawn */
function spawn(type){if(over)return;if(!type){const b=["brawler","brawler","scared","wobbly","runner"];if(wave>=2)b.push("zombie","zombie");if(wave>=3)b.push("tank");type=b[Math.random()*b.length|0]}
const d=E[type],side=Math.random()<.5?-1:1,s=1+Math.min(wave,20)*.04;
en.push({x:side>0?cam+W+60:cam-60,y:G,vx:0,vy:0,hp:d.hp*(type=="boss"?1+wave*.15:s),mh:d.hp*(type=="boss"?1+wave*.15:s),type,d,boss:type=="boss",f:-side,st:"walk",t:0,cd:40+Math.random()*60,ko:0,rot:0,stun:0,charge:0,name:type})}
/* hero actions */
function shoot(){if(hero.wp.u<=0)return;hero.wp.u--;hero.st="shoot";hero.t=9;hero.hf=[];bul.push({x:hero.x+hero.f*58,y:hero.y-64,vx:hero.f*20,l:60});hero.vx-=hero.f*3;snd("punch");shake=3;burst(hero.x+hero.f*62,hero.y-64,"#ffee88",4);if(hero.wp.u<=0){hero.wp=null;ft(hero.x,hero.y-130,"OUT OF AMMO","#ddd")}}
function buy(n){if(over)return;const i=n-7,c=[80,120,100][i]+ups[i]*70;if(coins<c){ft(hero.x,hero.y-130,"NEED "+c+" COINS","#ddd");return}coins-=c;ups[i]++;
if(i==0){hero.mh+=25;hero.hp=hero.mh}else if(i==1)dmul=1+ups[1]*.18;else spm=1+ups[2]*.08;snd("pick");ft(hero.x,hero.y-130,["MAX HP UP!","POWER UP!","SPEED UP!"][i],"#ffdd00")}
function wpn(h,s){const w=hero.wp.t;x.save();x.translate(h[0],h[1]);
if(w=="gun"){x.fillStyle="#222";x.fillRect(0,-6,30,10);x.fillRect(2,2,8,12)}
else{x.rotate(s=="swing"?(hero.t>hero.hf[0]?-2.1:.7):-.9);x.lineCap="round";
if(w=="bat"){x.strokeStyle="#8b5a2b";x.lineWidth=10;x.beginPath();x.moveTo(0,0);x.lineTo(62,0);x.stroke()}

x.restore()}
function atk(k){if(over||paused||hero.t>0||hero.blk)return;
if(k=="p"&&hero.wp&&!hero.crh){if(hero.wp.t=="gun"){shoot();return}const t=Math.round(24/st.s);hero.chT>0?hero.chain++:hero.chain=1;hero.chT=34;hero.type="p";hero.mv="wp";hero.st="swing";hero.t=t;hero.hf=[t-10];snd("kick");return}
hero.chT>0?hero.chain++:hero.chain=1;hero.chT=34;const bx=st.n=="BOXING";
hero.type=k;hero.mv=k=="p"?(hero.crh?"up":"p"):hero.crh?"sw":!hero.g?"fly":hero.chain%2?"rh":"ax";
hero.st={p:"punch",up:"upper",rh:"kick",fly:"kick",ax:"axe",sw:"sweep"}[hero.mv];
const t=Math.round((k=="p"?(hero.mv=="up"?20:bx?28:22):24)/st.s);hero.t=t;
hero.hf=hero.mv=="p"?(bx?[t-5,t-12,t-19]:[t-5,t-12]):[t-Math.round(t*.4)];
snd(k=="p"?"punch":"kick")}
function grab(){if(over||paused||hero.t>0||!hero.g)return;let b=null,bd=95;
en.forEach(e=>{const d=Math.abs(e.x-hero.x);if(e.hp>0&&!e.boss&&!e.held&&!e.thrown&&!e.dn&&d<bd){b=e;bd=d}});
if(!b){ft(hero.x,hero.y-130,"NOTHING TO GRAB","#ddd");return}
hero.gr=b;b.held=1;b.stun=0;b.st="held";hero.st="throw";hero.t=30;hero.f=b.x>hero.x?1:-1;hero.hf=[];snd("dash");rage=Math.min(100,rage+3)}
function release(){const e=hero.gr;hero.gr=null;if(!e)return;e.held=0;e.thrown=1;e.tl=[];e.st="hit";e.vx=hero.f*26;e.vy=-7;e.x=hero.x+hero.f*45;snd("kick");shake=6;ft(e.x,e.y-100,"THROW!","#ffaa00")}
function dash(){if(over||paused||hero.dash>0||hero.t>0)return;hero.dash=12;hero.inv=Math.max(hero.inv,14);hero.vx=hero.f*17;snd("dash");burst(hero.x,hero.y-20,"#ffd9a0",8)}
function strike(idx){const k=hero.type,mv=hero.mv,last=idx==hero.hf.length-1,fin=hero.chain>=3&&last,air=!hero.g;let hits=0;
const rc=(mv=="wp"?(hero.wp.t=="sword"?142:126):k=="p"?88:mv=="ax"?100:118)+(air?10:0);
en.forEach(e=>{if(e.hp<=0||e.dn>0||e.held||e.thrown)return;const dx=e.x-hero.x,ad=Math.abs(dx);if(ad>rc||(Math.sign(dx)!=hero.f&&ad>35)||Math.abs(e.y-hero.y)>130)return;
hits++;let dm=(k=="p"?st.p*.7:st.k)+(k=="k"?wave:0);
if(mv=="wp")dm=hero.wp.t=="sword"?44:32;dm*=dmul;if(mv=="up")dm*=1.5;if(mv=="ax")dm*=1.4;if(mv=="sw")dm*=.7;if(fin)dm*=1.6;if(air)dm*=1.15;dm=Math.round(dm);e.hp-=dm;
let kx=k=="p"?(last?12:3):mv=="rh"?22:9,ky=k=="p"?-3:-8;
if(mv=="up"){kx=4;ky=-17}if(mv=="ax"){kx=3;ky=-4}if(fin){kx=18;ky=-10}
e.vx=hero.f*kx*(e.boss?.35:1);e.vy=ky*(e.boss?.5:1);e.st="hit";e.stun=e.boss?8:(k=="p"&&!last?9:18);
if(!e.boss&&(mv=="sw"||mv=="ax"||(fin&&k=="k"))){e.dn=75;e.st="down";e.rot=-e.f*1.45;e.vy=-4}
rage=Math.min(100,rage+(k=="k"?9:5)+(fin?6:0));shake=fin?12:k=="k"?8:4;stop=fin?7:(mv=="up"||mv=="ax")?5:2;flash=2;
burst(e.x,e.y-60,st.c,fin?24:12);
const nm=fin?"FINISHER!":mv=="p"?["JAB!","CROSS!","HOOK!"][idx]:{up:"UPPERCUT!",rh:"ROUNDHOUSE!",ax:"AXE KICK!",sw:"LEG SWEEP!",fly:"FLYING KICK!",wp:"SMASH!"}[mv];
ft(e.x,e.y-125,nm,fin?"#ff8800":k=="k"?"#ff4040":"#ffd000");snd("hit");
combo++;comboT=100;score+=dm*2;if(e.hp<=0)ko(e,k,fin)});
if(hits&&mv=="wp"&&hero.wp&&--hero.wp.u<=0){hero.wp=null;ft(hero.x,hero.y-130,"WEAPON BROKE!","#ddd")}if(hits&&fin)hero.chain=0;if(!hits&&last)combo=0}
function ko(e,k,fin){e.hp=0;e.st="ko";e.dn=0;e.rev=!e.boss&&!e.revived&&!fin&&Math.random()<(e.type=="zombie"?.6:.3);e.ko=e.boss?200:e.rev?100:110;e.vx=hero.f*(e.boss?12:22);e.vy=e.boss?-11:-16;e.rot=hero.f*.15;
score+=(e.boss?2000:k=="k"?180:120)*Math.max(1,combo>>1);rage=Math.min(100,rage+15);shake=e.boss?26:14;stop=e.boss?12:6;
burst(e.x,e.y-50,"#ffcc00",30);ft(e.x,e.y-150,e.boss?"BOSS K.O.!":e.rev?"DOWN!":"K.O.!","#ff4400");snd("ko");
if(e.boss)banner("BOSS K.O.!","#ffe000");
coins+=e.boss?60:8+wave;const r=Math.random();if(r<(e.boss?1:.3))pick.push({x:e.x,y:G-30,vy:-8,type:e.boss||r<.09?"hp":["bat","sword","gun"][Math.random()*3|0]})}
function rageAtk(){if(over||paused||rage<100||hero.t>0)return;rage=0;hero.st="super";hero.t=60;hero.inv=70;shake=28;snd("sup");banner("RAGE MODE!",st.c);
en.forEach(e=>{if(e.hp<=0||Math.abs(e.x-hero.x)>380)return;const dir=e.x>hero.x?1:-1;
if(e.boss){e.hp-=e.mh*.3;e.vx=dir*14;e.st="hit";e.stun=30;ft(e.x,e.y-150,"-30%","#ff0");if(e.hp<=0)ko(e,"k")}
else{e.hp=0;e.st="ko";e.ko=110;e.vx=dir*30;e.vy=-18;e.rot=dir*.3;score+=250}
burst(e.x,e.y-60,st.c,35)});wd.push({x:hero.x,y:hero.y-40,r:0,c:st.c})}
function hurtHero(a,fx){if(hero.inv>0||over)return;
if(hero.blk&&Math.sign(fx-hero.x)==hero.f){a=Math.floor(a*.2);snd("block");ft(hero.x,hero.y-130,"BLOCK!","#66ccff");hero.vx=fx>hero.x?-5:5;rage=Math.min(100,rage+4)}
else{snd("hit");shake=11;hero.vx=fx>hero.x?-9:9;hero.vy=-6;hero.g=0;hero.st="hurt";hero.t=10;combo=0;hero.chain=0;hero.hf=[];if(hero.gr){hero.gr.held=0;hero.gr.st="walk";hero.gr=null}ft(hero.x,hero.y-130,"OOF!","#ff4444")}
hero.hp=Math.max(0,hero.hp-a);hero.inv=28;
if(hero.hp<=0){over=true;hero.st="ko";snd("ko");if(score>hi){hi=score;try{localStorage.setItem("sbhi",hi)}catch(e){}}}}
/* update */
function upHero(){const h=hero;h.blk=(K.l&&h.g&&h.t==0)?1:0;h.crh=(K.s&&h.g&&!h.blk)?1:0;
if(h.dash>0)h.dash--;
if(h.t==0&&!h.blk&&h.dash==0){const sp=(h.crh?2.6:5.6)*spm;
if(K.a||K.arrowleft){h.vx=-sp;h.f=-1;h.st=h.crh?"crouch":"walk"}else if(K.d||K.arrowright){h.vx=sp;h.f=1;h.st=h.crh?"crouch":"walk"}else{h.vx*=.6;h.st=h.crh?"crouch":"idle"}
if((K.w||K[" "]||K.arrowup)&&h.g&&!h.crh){h.vy=-17.5;h.g=0}
if(!h.g)h.st="jump"}
if(h.t>0){h.t--;const i=h.hf.indexOf(h.t);if(i>=0)strike(i);if(h.st=="throw"&&h.t==12)release();if(h.t==0){h.hf=[];h.st="idle";if(h.gr)release()}}
if(h.chT>0){h.chT--;if(!h.chT)h.chain=0}
h.x+=h.vx;h.y+=h.vy;if(h.y<G||h.vy<0){h.vy+=.9;h.g=0}if(h.y>=G){h.y=G;h.vy=0;h.g=1}
h.x=Math.max(40,Math.min(WW-40,h.x));if(h.inv>0)h.inv--;if(h.t==0||h.st=="jump")h.vx*=h.dash?1:.85;
h.hpS+=(h.hp-h.hpS)*.12}
function upEn(){for(let i=en.length-1;i>=0;i--){const e=en[i],d=e.d;
if(e.hp<=0){e.x+=e.vx;e.y+=e.vy;e.vy+=.9;e.vx*=.97;e.rot+=e.vx*.025;if(e.y>=G){e.y=G;e.vy=Math.abs(e.vy)>3?e.vy*-.25:0;e.vx*=.82}if(--e.ko<=0){if(e.rev){e.rev=0;e.revived=1;e.hp=e.mh*.45;e.rot=0;e.st="walk";e.stun=0;e.vx=0;e.cd=30;ft(e.x,e.y-130,"NOT DONE YET!","#ffee00")}else en.splice(i,1)}continue}
if(e.held){e.x=hero.x+hero.f*40;e.y=hero.y-72;e.vx=e.vy=0;continue}
if(e.thrown){e.x+=e.vx;e.y+=e.vy;e.vy+=.7;e.vx*=.99;e.rot+=.3*(e.vx<0?-1:1);
if(e.x<25||e.x>WW-25){e.vx*=-.5;e.x=Math.max(25,Math.min(WW-25,e.x))}
en.forEach(o=>{if(o===e||o.hp<=0||o.held||o.thrown||e.tl.includes(o))return;if(Math.abs(o.x-e.x)<64&&Math.abs(o.y-e.y)<120){e.tl.push(o);o.hp-=32;o.vx=(e.vx<0?-1:1)*13;o.vy=-9;o.dn=o.boss?0:80;if(!o.boss){o.st="down";o.rot=-o.f*1.45}else{o.st="hit";o.stun=20}stop=6;shake=12;burst(o.x,o.y-60,"#ffaa00",20);ft(o.x,o.y-130,"STRIKE!","#ffaa00");score+=150;snd("hit");if(o.hp<=0)ko(o,"k",1)}});
if(e.y>=G){e.y=G;e.vy=0;e.thrown=0;e.rot=-e.f*1.45;e.hp-=15;e.dn=80;e.st="down";shake=10;burst(e.x,e.y-20,"#ffcc00",14);snd("hit");if(e.hp<=0)ko(e,"k",1)}
continue}
if(e.dn>0){if(e.y<G||e.vy<0){e.y+=e.vy;e.vy+=.9;if(e.y>=G){e.y=G;e.vy=0}}else e.dn--;e.x+=e.vx;e.vx*=.86;if(e.dn==0){e.st="walk";e.rot=0;e.stun=0;e.cd=30;ft(e.x,e.y-130,"GETTING UP","#fff")}continue}
const dx=hero.x-e.x,dist=Math.abs(dx);if(dist>30)e.f=dx>0?1:-1;
if(e.stun>0){e.stun--;e.st="hit";if(!e.stun)e.st="walk"}
else if(e.st=="wind"){e.t--;e.vx=0;if(e.t<=0){if(dist<=d.r+10&&Math.abs(hero.y-e.y)<95)hurtHero(d.dm,e.x);e.st="strike";e.t=10;e.cd=(e.boss?70:55)+Math.random()*55}}
else if(e.st=="strike"){e.t--;if(e.t<=0)e.st="walk"}
else{e.cd--;const r=d.r-8;let sp=d.sp;
if(e.type=="scared"){if(dist<200&&e.charge<=0){e.vx=-e.f*sp;e.st="run";if(Math.random()<.008)e.charge=90}else{if(e.charge>0)e.charge--;e.vx=e.f*(e.charge>0?sp*1.6:1.2);e.st="run"}}
else if(dist>r){if(e.type=="wobbly")sp+=Math.sin(frame*.15)*.9;e.vx=e.f*sp;e.st=e.type=="runner"?"run":"walk"}else e.vx=0;
if(dist<=d.r&&e.cd<=0&&e.type!="scared"||e.type=="scared"&&dist<=d.r&&e.cd<=0){e.st="wind";e.t=d.wd;e.vx=0;if(e.boss&&Math.random()<.4)e.t+=12}}
e.x+=e.vx;e.vx*=.86;
if(e.st=="hit"){e.x+=e.vx}
e.vy+=e.y<G?.85:0;e.y+=e.vy;if(e.y>=G){e.y=G;e.vy=0}
const md=e.boss?75:52,cd2=Math.abs(e.x-hero.x);if(cd2<md&&hero.y>G-70)e.x=e.x<hero.x?hero.x-md:hero.x+md;
en.forEach((o,j)=>{if(j==i||o.hp<=0)return;const df=e.x-o.x,mn=e.boss||o.boss?80:48;if(Math.abs(df)<mn){const p=(mn-Math.abs(df))/2*(df<0?-1:1);e.x+=p;o.x-=p}});
e.x=Math.max(-100,Math.min(WW+100,e.x))}}
function waves(){if(!en.length&&spawnT<=0){wave++;if(wave%5==0){spawn("boss");banner("BOSS FIGHT!","#ff3333");snd("sup");spawnT=-1;return}
